[options]
; ==============================================================================
; CONFIGURACIÓN DE ODOO - ENTORNO DE DESARROLLO (odoo-dev.conf)
; ==============================================================================

; Rutas de módulos y persistencia interna
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Parámetros de conexión a PostgreSQL
db_host = db
db_port = 5432
db_user = odoo
db_password = SuperSecure_DB_Pass_2026!

; Concurrencia: workers = 0 activa el modo monohilo (facilita depuración con pdb y trazas unificadas)
workers = 0
max_cron_threads = 1

; Límites temporales y de memoria holgados para prevenir interrupciones durante depuración
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

; Nivel de detalle de registro para diagnósticos
log_level = debug
