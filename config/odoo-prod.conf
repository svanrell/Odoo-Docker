[options]
; ==============================================================================
; CONFIGURACIÓN DE ODOO - ENTORNO DE PRODUCCIÓN (odoo-prod.conf)
; ==============================================================================

; Rutas de módulos y persistencia interna
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Parámetros de conexión a PostgreSQL
db_host = db
db_port = 5432
db_user = odoo
db_password = SuperSecure_DB_Pass_2026!

; Multiproceso: mínimo 2 workers para peticiones HTTP concurrentes + hilo dedicado para cron
workers = 2
max_cron_threads = 1

; Integración con Reverse Proxy (Nginx / Traefik con terminación TLS/SSL)
proxy_mode = True

; Límites estrictos para contención de recursos y prevención de fugas de memoria
limit_time_cpu = 60
limit_time_real = 120
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

; Nivel estándar de registro para producción
log_level = info
